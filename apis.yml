name: DLT Payments
description: >-
  DLT Payments (DLTPAY) is a Web3 payments company offering a stablecoin wallet
  that enables businesses to send and receive instant payments in stablecoins
  across multiple blockchain networks — Ethereum, Arbitrum, Optimism, Polygon,
  and BNB Chain — with zero exposure to cryptocurrency price volatility. The
  product targets merchants and businesses that want the settlement speed and
  low cost of blockchain rails without the FX risk of holding volatile tokens.
  DLT Payments is a Techstars portfolio company. Added to the API Evangelist
  network and enriched from its public web surface; no public API, OpenAPI
  specification, or developer documentation was discovered at enrichment time.
